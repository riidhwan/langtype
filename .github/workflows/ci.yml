name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ci / lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directories
        run: mkdir -p reports/vitest reports/playwright

      - name: Lint
        id: lint
        run: npm run lint

      - name: Unit and component tests
        id: unit-tests
        run: npm test -- --run --reporter=default --reporter=junit --outputFile=reports/vitest/junit.xml

      - name: Coverage
        id: coverage
        run: npm run test:coverage -- --coverage.reporter=json-summary --coverage.reporter=text-summary

      - name: Build
        id: build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        id: e2e-tests
        run: npm run test:e2e

      - name: Publish CI summary
        if: always()
        run: |
          {
            echo "## CI verification"
            echo ""
            echo "| Check | Command |"
            echo "| --- | --- |"
            echo "| Lint | \`npm run lint\` |"
            echo "| Unit/component tests | \`npm test -- --run\` |"
            echo "| Coverage | \`npm run test:coverage -- --coverage.reporter=json-summary --coverage.reporter=text-summary\` |"
            echo "| Production build | \`npm run build\` |"
            echo "| End-to-end tests | \`npm run test:e2e\` |"
            echo ""
            echo "Vitest JUnit output and Playwright reports are uploaded as workflow artifacts when present."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report
          path: reports/vitest/junit.xml
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: reports/playwright/results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment PR test report
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          E2E_OUTCOME: ${{ steps.e2e-tests.outcome }}
        run: node scripts/github/comment-ci-report.mjs
